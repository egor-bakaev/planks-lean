    Complete formalization of Bezdek's annulus theorem and the quantitative
    overlap theorem in the plane. The comparator challenge `bezdek_annulus`
    and the library theorems `Annulus.overlap_theorem` and
    `Annulus.bezdek_annulus'` are proved with no sorries, using only the
    standard axioms `propext`, `Classical.choice`, and `Quot.sound`.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "bezdek_annulus"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "Annulus.overlap_theorem"
      file: "RequestProject/Overlap/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "Annulus.bezdek_annulus'"
      file: "RequestProject/Overlap/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]


version: "v0.4"

project:
  name: "Area stability of planar plank covers and Bezdek's annulus theorem"
  description: >-
    A complete Lean 4 formalization of Bezdek's annulus theorem and the
    quantitative area stability of planar plank covers based on the paper
    "Area stability of plank covers" by Egor Bakaev and Amir Yehudayoff
    (arXiv:2609.30409). The formalization proves that there exists an
    explicit positive radius r > 0 such that if finitely many planar planks
    cover the closed annulus r <= ||x|| <= 1, their total width is at
    least 2. The core theorem established is the quantitative overlap
    theorem, which bounds the excess overlap cost on the unit disk from
    below by a positive constant times the hole area divided by r.
  authors:
    - "Arseniy Akopyan"
  responsible_maintainers:
    - "Arseniy Akopyan"
  license: "Apache-2.0"

classification:
  arxiv: ["math.MG", "math.CO"]
  msc2020: ["52C10", "52A10", "52A38"]

sources:
  - title: "Area stability of plank covers"
    authors:
      - "Egor Bakaev"
      - "Amir Yehudayoff"
    type: "article"
    id: "arXiv:2609.30409"
    location: "arXiv:2609.30409"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Formalization of Egor Bakaev and Amir Yehudayoff's paper from arXiv
      (arXiv:2609.30409), proving the area stability of plank covers and
      resolving Bezdek's annulus problem.
  - title: "Covering an Annulus by Strips"
    authors:
      - "Andras Bezdek"
    type: "paper"
    id: "doi:10.1007/s00454-003-0002-y"
    location: "Discrete & Computational Geometry 30 (2003), no. 2, 177-180"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The original problem formulation: whether there exists r > 0 such that
      any collection of planks covering the annulus r <= ||x|| <= 1 has total
      width at least 2.

related_formalizations: []

status:
